<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- ServiceDATA Mobil – Offline-Erfassung für iPhone/iPad (PWA) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#001734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ServiceDATA">
<meta name="format-detection" content="telephone=no">
<title>ServiceDATA Mobil</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#001734; --bg2:#022652; --card:#0a3266; --card2:#0e3b77; --line:rgba(255,255,255,.12);
  --text:#fff; --muted:rgba(255,255,255,.66); --yellow:#FFCC00; --yellow2:#ffd83d; --ink:#001734;
  --green:#2fbf71; --red:#ff6b6b; --orange:#ffa94d;
  --r:16px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--yellow)}
.hidden{display:none!important}

/* Kopf */
.top{position:sticky;top:0;z-index:20;background:rgba(0,23,52,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--st) + 8px) 12px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px;min-height:44px}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.top .brand img{width:36px;height:36px}
.top .brand b{font-size:19px;letter-spacing:.2px}
.top .brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.ibtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--text);flex:none}
.ibtn:active{background:rgba(255,255,255,.1)}
.ibtn svg{width:24px;height:24px}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;transition:opacity .3s}
.saved svg{width:14px;height:14px;color:var(--green)}

/* Schritte */
.steps{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--muted)}
.steps button.on{background:var(--yellow);color:var(--ink)}
.steps button .n{min-width:20px;height:20px;border-radius:10px;background:rgba(255,255,255,.16);font-size:12px;display:grid;place-items:center;padding:0 5px}
.steps button.on .n{background:rgba(0,23,52,.15)}
.steps button.ok:not(.on){color:var(--text)}

main{padding:14px 14px calc(110px + var(--sb));max-width:720px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sec-t{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:20px 4px 8px}

/* Formular */
.f{margin-bottom:12px}
.f:last-child{margin-bottom:0}
.f label,.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px;font-weight:600}
.inp{width:100%;min-height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,10,30,.35);padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,204,0,.2)}
textarea.inp{min-height:110px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=date].inp{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.withbtn{display:flex;gap:8px}
.withbtn .inp{flex:1;min-width:0}
.scanbtn{flex:none;width:58px;min-height:52px;border-radius:12px;border:0;background:var(--yellow);color:var(--ink);display:grid;place-items:center}
.scanbtn svg{width:26px;height:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 13px;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{background:rgba(255,204,0,.25)}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow);font-weight:600}
.chip.x{padding-right:8px;display:inline-flex;align-items:center;gap:6px}
.chip.x i{font-style:normal;opacity:.7;font-size:18px;line-height:1}

/* Knöpfe */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);font-size:17px;font-weight:650;padding:12px 16px;text-decoration:none;color:var(--text)}
.btn:active{transform:scale(.985)}
.btn svg{width:22px;height:22px;flex:none}
.btn.pri{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.btn.pri:active{background:var(--yellow2)}
.btn.big{min-height:72px;font-size:19px;border-radius:18px}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.4)}
.btn.slim{min-height:44px;font-size:15px;width:auto}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 14px calc(10px + var(--sb));background:linear-gradient(to top,var(--bg) 70%,rgba(0,23,52,0));display:flex;gap:10px;max-width:720px;margin:0 auto}
.bar .btn{flex:1}
.bar .btn.back{flex:0 0 64px;padding:0}

/* Listen */
.item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;width:100%;text-align:left;color:var(--text)}
.item:active{background:var(--card)}
.item .ic{width:46px;height:46px;border-radius:12px;background:rgba(255,204,0,.14);color:var(--yellow);display:grid;place-items:center;flex:none;overflow:hidden}
.item .ic img{width:100%;height:100%;object-fit:contain;background:#fff}
.item .ic svg{width:24px;height:24px}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .chev{color:var(--muted);flex:none}
.item .chev svg{width:20px;height:20px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:4px;vertical-align:1px;text-transform:uppercase;letter-spacing:.04em}
.tag.entwurf{background:rgba(255,169,77,.2);color:var(--orange)}
.tag.gesendet{background:rgba(47,191,113,.2);color:var(--green)}
.tag.geaendert{background:rgba(255,204,0,.2);color:var(--yellow)}
.tag.geplant{background:rgba(120,170,255,.2);color:#9cc3ff}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:15px}
.hint{font-size:13.5px;color:var(--muted);line-height:1.45}
.hint b{color:var(--text)}
.warn{background:rgba(255,169,77,.12);border:1px solid rgba(255,169,77,.35);color:#ffd8b0;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.okbox{background:rgba(47,191,113,.12);border:1px solid rgba(47,191,113,.35);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* Maschinen */
.mcard{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;width:100%;text-align:left}
.mcard .num{width:34px;height:34px;border-radius:10px;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.mcard .thumb{width:52px;height:52px;border-radius:10px;background:#fff;flex:none;overflow:hidden;display:grid;place-items:center;color:#8aa}
.mcard .thumb img{width:100%;height:100%;object-fit:contain}
.mcard .tx{flex:1;min-width:0}
.mcard .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .kv{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.mcard .kv b{color:var(--text);font-weight:600}
.mcard .miss{color:var(--orange)}

/* Fotos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000;border:0;padding:0}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph span{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 5px;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Gehäuse-Auswahl */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gtile{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:14px;font-weight:600;color:var(--text)}
.gtile.on{border-color:var(--yellow);background:rgba(255,204,0,.1)}
.gtile .gi{aspect-ratio:4/3;background:#fff;border-radius:9px;margin-bottom:6px;display:grid;place-items:center;overflow:hidden;color:#99a}
.gtile .gi img{width:100%;height:100%;object-fit:contain}
.gtile small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}

/* Segment */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:rgba(0,10,30,.35);border-radius:14px;padding:5px}
.seg button{border:0;border-radius:10px;min-height:48px;background:transparent;font-weight:650;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--yellow);color:var(--ink)}
.seg button.on.st-stoerung{background:var(--red);color:#fff}
.seg button.on.st-geplant{background:#78aaff;color:var(--ink)}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:4px 2px}
.sw{position:relative;width:56px;height:34px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:17px;background:rgba(255,255,255,.2);transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--yellow)}
.sw input:checked+span::after{transform:translateX(22px)}

/* Overlays */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow:auto;padding:8px 14px calc(16px + var(--sb));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:19px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%);z-index:90;background:#fff;color:var(--ink);font-weight:650;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 28px);font-size:15px;animation:up .25s}
.toast.err{background:var(--red);color:#fff}

/* Scanner */
.scan{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:8%;right:8%;top:32%;height:22%;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);border:3px solid var(--yellow)}
.scan .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,80,80,.9);box-shadow:0 0 8px rgba(255,0,0,.8);animation:scanl 1.6s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-30px)}50%{transform:translateY(30px)}}
.scan .stop{position:relative;padding:calc(var(--st) + 12px) 14px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
.scan .stop b{flex:1;font-size:17px}
.scan .sbot{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(18px + var(--sb));background:linear-gradient(transparent,rgba(0,0,0,.85) 35%)}
.scan .msg{text-align:center;font-size:15px;margin-bottom:12px;color:#ddd}
.scan .res{background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin-bottom:10px;text-align:center}
.scan .res .v{font-size:24px;font-weight:800;word-break:break-all;margin:4px 0 2px;font-family:ui-monospace,Menlo,monospace}
.scan .res small{color:#567}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb .lbb{padding:12px 14px calc(14px + var(--sb));display:grid;gap:10px;background:var(--bg)}

/* Start */
.hero{text-align:center;padding:26px 8px 6px}
.hero img.sun{width:110px;height:110px}
.hero h1{margin:8px 0 2px;font-size:28px}
.hero p{color:var(--muted);margin:0 0 18px}
.ios-tip{display:flex;gap:12px;align-items:flex-start}
.ios-tip svg{width:28px;height:28px;flex:none;color:var(--yellow)}
.kbd-share{display:inline-block;vertical-align:-4px}
.kbd-share svg{width:18px;height:18px;color:#5ac8fa}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:600;word-break:break-word}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px}
.chk svg{width:20px;height:20px;flex:none;margin-top:1px}
.chk.ok svg{color:var(--green)} .chk.no svg{color:var(--orange)}
@media (min-width:600px){.ggrid{grid-template-columns:repeat(3,1fr)}.pgrid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* =========================================================================
   ServiceDATA Mobil  –  Datenerfassung vor Ort (offline)
   Version 1.1 (Installationen abrufen)
   - Daten bleiben im Gerät (IndexedDB), auch ohne Netz.
   - "An ServiceDATA senden" erzeugt eine ZIP-Datei (erfassung.json + fotos/),
     die über das Teilen-Menü in den gemeinsamen OneDrive-Ordner
     ServiceDATA/mobil/eingang gespeichert wird. ServiceDATA am PC liest sie ein.
   - Stammdaten (Produkte, Locations, Ansprechpartner, geplante Einsätze) kommen
     als Datei "ServiceDATA-Mobil-Daten.json" vom PC.
   - Spätere Stufe 2 (Microsoft-Graph-Abgleich): nur die Funktion send() bzw.
     ein Transport-Modul TRANSPORT ergänzen; Datenformat bleibt gleich.
   ========================================================================= */
const VERSION = '1.1';
const FORMAT = 'servicedata-mobil';
const FORMAT_VER = 1;
const STAMM_FORMAT = 'servicedata-mobil-daten';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) : '–';
const fmtDT = iso => iso ? new Date(iso).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : '–';
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const clone = o => JSON.parse(JSON.stringify(o));
const uniq = arr => [...new Set(arr.map(x => String(x || '').trim()).filter(Boolean))];
const isIOS = /iP(hone|ad|od)/.test(navigator.platform) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

const IC = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

/* ---------------- Speicher (IndexedDB) ---------------- */
let DBP = null;
function db() {
  return DBP ||= new Promise((res, rej) => {
    const r = indexedDB.open('servicedata-mobil', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('erf', { keyPath: 'id' }); d.createObjectStore('blobs'); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store); let out; const q = fn(s); if (q) q.onsuccess = () => { out = q.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abgebrochen')); });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const blobGet = k => tx('blobs', 'readonly', s => s.get(k));
const blobSet = (k, v) => tx('blobs', 'readwrite', s => s.put(v, k));
const blobDel = k => tx('blobs', 'readwrite', s => s.delete(k));
const erfAll = () => tx('erf', 'readonly', s => s.getAll());
const erfGet = id => tx('erf', 'readonly', s => s.get(id));
const erfPut = e => tx('erf', 'readwrite', s => s.put(e));
const erfDel = id => tx('erf', 'readwrite', s => s.delete(id));

let toastT = null;
function toast(msg, err = false, ms = 2600) {
  $('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.append(t);
  toastT = setTimeout(() => t.remove(), ms);
}
function sheet(html, onOpen) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
    document.body.append(bg);
    const close = v => { bg.remove(); res(v); };
    bg.addEventListener('click', e => { if (e.target === bg) close(null); const b = e.target.closest('[data-close]'); if (b) close(b.dataset.close === '' ? null : b.dataset.close); });
    onOpen?.(bg.firstElementChild, close);
  });
}

function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(); const g = a.createGain(); o.frequency.value = 1320; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 110); } catch { } }
async function resizeImage(file, max = 2200, q = .85) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    if (blob) return blob;
  } catch (e) { console.warn(e); }
  return file;
}
async function photoUrl(id) {
  if (S.urls.has(id)) return S.urls.get(id);

  const u = URL.createObjectURL(b); S.urls.set(id, u); return u;
}
function pickFiles(accept, capture, multiple) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; if (capture) i.setAttribute('capture', 'environment'); if (multiple) i.multiple = true;
    i.style.display = 'none'; document.body.append(i);
    i.onchange = () => { res([...i.files]); i.remove(); };
    i.click();
  });
}

function locIndex() {
  const m = new Map();
  const put = (o) => { const k = (o.ort || '').trim().toLowerCase(); if (!k) return; const e = m.get(k) || { ort: o.ort.trim(), land: '', bundesland: '', floors: [], kontakte: [] }; e.land ||= o.land || ''; e.bundesland ||= o.bundesland || ''; e.floors = uniq([...e.floors, ...(o.floors || [o.floor])]); for (const k2 of o.kontakte || []) if (k2.name && !e.kontakte.some(x => x.name.toLowerCase() === k2.name.toLowerCase())) e.kontakte.push(k2); m.set(k, e); };
  for (const l of S.stamm?.locations || []) put(l);
  for (const e of S.list || []) put(e.daten);
  return [...m.values()].sort((a, b) => a.ort.localeCompare(b.ort, 'de'));
}

}

async function route() {
  const [v, id, sub, sub2] = location.hash.slice(2).split('/');
  closeScanner();
  if (!S.user) return renderWelcome();
  if (v === 'e' && id) {
    if (!S.cur || S.cur.id !== id) { S.cur = await erfGet(id); if (!S.cur) { location.hash = '#/'; return; } }
    if (sub === 'm') return renderMachine(sub2);
    return renderErf(sub || 'ort');
  }
  await flushSave(); S.cur = null;
  if (v === 'einstellungen') return renderSettings();
  if (v === 'i') return id ? renderInstall(decodeURIComponent(id), sub ? decodeURIComponent(sub) : '') : renderInstalls();
  return renderHome();
}

/* ---------------- Barcode-Scanner ---------------- */
let SC = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'zxing.min.js'; s.onload = res; s.onerror = () => rej(new Error('Scanner-Bibliothek nicht geladen')); document.head.append(s); });
}
function closeScanner(v = null) {
  if (!SC) return; const s = SC; SC = null;
  s.stop = true; s.stream?.getTracks().forEach(t => t.stop()); s.el.remove(); s.res(v);
}
function scanner(title) {
  return new Promise(async res => {
    closeScanner();
    const el = document.createElement('div'); el.className = 'scan';
    el.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>
      <div class="stop"><button class="ibtn" data-x aria-label="Abbrechen">${IC.close}</button><b>${esc(title)}</b><button class="ibtn hidden" id="scTorch" aria-label="Licht">${IC.light}</button></div>
      <div class="sbot"><div class="msg" id="scMsg">Barcode oder QR-Code in den Rahmen halten</div><div id="scRes"></div><button class="btn" data-x>Abbrechen</button></div>`;
    document.body.append(el);
    SC = { el, res, stop: false };
    $$('[data-x]', el).forEach(b => b.onclick = () => closeScanner(null));
    const msg = t => { const m = $('#scMsg', el); if (m) m.textContent = t; };
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera wird von diesem Browser nicht unterstützt.');
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      if (!SC || SC.el !== el) { stream.getTracks().forEach(t => t.stop()); return; }
      SC.stream = stream;
      const v = $('video', el); v.srcObject = stream; await v.play().catch(() => { });
      const track = stream.getVideoTracks()[0];
      try {
        const caps = track.getCapabilities?.() || {};
        if (caps.torch) { const tb = $('#scTorch', el); tb.classList.remove('hidden'); let on = false; tb.onclick = () => { on = !on; track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => { }); }; }
        if (caps.focusMode?.includes?.('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => { });
      } catch { }

      if ('BarcodeDetector' in window) {
        try {
          const fm = await BarcodeDetector.getSupportedFormats();
          if (fm.length) { const bd = new BarcodeDetector({ formats: fm }); detect = async c => { const r = await bd.detect(c); return r[0]?.rawValue || ''; }; }
        } catch { }
      }
      if (!detect) {
        msg('Scanner wird vorbereitet …');
        await loadZXing();
        const Z = window.ZXing; const hints = new Map();
        hints.set(Z.DecodeHintType.TRY_HARDER, true);
        hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, ['CODE_128', 'CODE_39', 'CODE_93', 'EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'ITF', 'CODABAR', 'QR_CODE', 'DATA_MATRIX'].map(k => Z.BarcodeFormat[k]).filter(x => x !== undefined));
        const reader = new Z.MultiFormatReader(); reader.setHints(hints);
        detect = async c => { try { const r = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))); return r.getText(); } catch { return ''; } finally { reader.reset(); } };
        msg('Barcode oder QR-Code in den Rahmen halten');
      }
      const cv = document.createElement('canvas'); const cx = cv.getContext('2d', { willReadFrequently: true });
      let n = 0, paused = false;
      const loop = async () => {
        if (!SC || SC.el !== el || SC.stop) return;
        if (!paused && v.videoWidth) {
          // Ausschnitt passend zum Rahmen (mittlerer Bereich), abwechselnd mit ganzem Bild
          const vw = v.videoWidth, vh = v.videoHeight; const full = n++ % 3 === 2;
          const sw = full ? vw : vw * .9, sh = full ? vh : vh * .45, sx = (vw - sw) / 2, sy = (vh - sh) / 2;
          const sc = Math.min(1, 1280 / sw); cv.width = Math.round(sw * sc); cv.height = Math.round(sh * sc);
          cx.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
          const txt = (await detect(cv)).trim();
          if (txt && SC?.el === el) { paused = true; beep(); showRes(txt); }
        }
        setTimeout(loop, 120);
      };
      const showRes = txt => {
        msg('Erkannt – stimmt das?');
        $('#scRes', el).innerHTML = `<div class="res"><small>Gelesen</small><div class="v">${esc(txt)}</div></div><div class="btns two" style="margin-bottom:10px"><button class="btn" id="scAgain">Nochmal</button><button class="btn pri" id="scOk">${IC.check} Übernehmen</button></div>`;
        $('#scOk', el).onclick = () => closeScanner(txt);
        $('#scAgain', el).onclick = () => { $('#scRes', el).innerHTML = ''; msg('Barcode oder QR-Code in den Rahmen halten'); setTimeout(() => { paused = false; }, 400); };
      };
      loop();
    } catch (err) {
      const denied = err.name === 'NotAllowedError';
      msg(denied ? 'Kein Zugriff auf die Kamera. Bitte in den iOS-Einstellungen erlauben (Einstellungen › Safari › Kamera) und erneut versuchen.' : 'Kamera nicht verfügbar: ' + err.message);
    }
  });
}

  d.techniker = uniq(d.techniker);
  d.kontakte = d.kontakte.filter(k => k.name || k.telefon || k.email);
  const out = { format: FORMAT, version: FORMAT_VER, app: 'ServiceDATA Mobil ' + VERSION, mobilId: e.id, basisId: e.basisId || '', basisRev: e.basisRev || 0, basis: e.basis || null, von: S.user, erstelltAm: e.erstelltAm, exportiertAm: new Date().toISOString(), daten: d, fotos: e.fotos.map(f => ({ id: f.id, datei: f.datei, titel: f.titel || '', von: f.von || S.user, am: f.am, ...(f.geraetId ? { geraetId: f.geraetId } : {}) })) };
  const files = [{ name: 'erfassung.json', data: new TextEncoder().encode(JSON.stringify(out, null, 2)) }];
  for (const f of e.fotos) { const b = await blobGet(f.id); if (b) files.push({ name: 'fotos/' + f.datei, data: b }); }
  const name = `SD-Mobil_${d.datum || today()}_${slug(d.ort) || 'installation'}_${e.id.slice(-5)}.zip`;
  return new File([await makeZip(files)], name, { type: 'application/zip' });
}
// Transport: Stufe 1 = Teilen-Menü / Download. Für Stufe 2 (Microsoft Graph) hier eine weitere Variante ergänzen.
async function send(e) {
  await flushSave();
  if (!e.daten.ort.trim()) { toast('Bitte zuerst die Location eintragen', true); return go(`#/e/${e.id}/ort`); }
  const btn = $('#xSend'); if (btn) { btn.disabled = true; btn.innerHTML = 'Datei wird erstellt …'; }
  let file;
  try { file = await buildExport(e); } catch (err) { toast('Datei konnte nicht erstellt werden: ' + err.message, true, 5000); return renderErf('abschluss'); }
  const stand = sig(e);
  const mark = async () => { e.gesendetAm = new Date().toISOString(); e.gesendetStand = stand; await erfPut(e); };
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); await mark(); toast('Gesendet ✓'); return renderErf('abschluss'); }
    catch (err) { if (err.name === 'AbortError') { renderErf('abschluss'); return toast('Senden abgebrochen'); } console.warn(err); }
  }
  // Fallback: Download
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  const ok = await sheet(`<h3>Datei gespeichert?</h3><p class="hint" style="font-size:15px">Die Datei <b>${esc(file.name)}</b> wurde zum Herunterladen angeboten. Speichere sie in den OneDrive-Ordner <b>ServiceDATA › mobil › eingang</b>.</p><div class="btns"><button class="btn pri" data-close="ok">Ja, gespeichert</button><button class="btn" data-close="">Noch nicht</button></div>`);
  if (ok === 'ok') { await mark(); toast('Als gesendet markiert'); }
  renderErf('abschluss');
}

/* ---------------- Einstellungen ---------------- */
async function renderSettings() {
  let est = null; try { est = await navigator.storage?.estimate?.(); } catch { }
  const persisted = await navigator.storage?.persisted?.().catch(() => false);
  const list = await erfAll();
  $('#app').innerHTML = `<div class="top"><div class="top-row"><button class="ibtn" id="sBack" aria-label="Zurück">${IC.back}</button><h1>Einstellungen</h1></div></div><main>
    <div class="card"><div class="f"><label for="sName">Dein Name</label><input class="inp" id="sName" value="${esc(S.user)}" autocomplete="name"></div></div>
    <div class="card"><h2>Daten aus ServiceDATA</h2>
      ${S.stamm ? `<dl class="sum" style="margin-bottom:12px"><dt>Stand</dt><dd>${esc(fmtDT(S.stamm.erstelltAm))}${S.stamm.von ? ' · ' + esc(S.stamm.von) : ''}</dd><dt>Produkte</dt><dd>${S.stamm.produkte?.length || 0}</dd><dt>Locations</dt><dd>${S.stamm.locations?.length || 0}</dd><dt>Einsätze</dt><dd>${S.stamm.einsaetze?.length || 0}</dd><dt>Installationen</dt><dd>${S.stamm.installationen?.length || 0}</dd></dl>` : `<p class="hint">Noch nicht geladen.</p>`}
      <button class="btn" id="sStamm">${IC.dl} ${S.stamm ? 'Neu laden' : 'Laden'}</button>
      <p class="hint" style="margin-top:10px">Am PC in ServiceDATA: <b>iPhone-Erfassung › Daten fürs iPhone erstellen</b>. Hier dann die Datei <b>ServiceDATA-Mobil-Daten.json</b> aus OneDrive (Ordner ServiceDATA › mobil) auswählen.</p></div>
    <div class="card"><h2>Speicher</h2><dl class="sum"><dt>Erfassungen</dt><dd>${list.length}</dd><dt>Fotos</dt><dd>${list.reduce((s, e) => s + e.fotos.length, 0)}</dd>${est?.usage != null ? `<dt>Belegt</dt><dd>${(est.usage / 1048576).toFixed(1).replace('.', ',')} MB</dd>` : ''}<dt>Dauerhaft</dt><dd>${persisted ? 'ja' : (standalone() ? 'nein' : 'nein – App auf Home-Bildschirm legen')}</dd></dl>
      ${list.some(e => erfState(e) === 'gesendet') ? `<button class="btn" id="sClean" style="margin-top:12px">${IC.trash} Gesendete Erfassungen aufräumen</button><p class="hint" style="margin-top:8px">Löscht nur Erfassungen, die gesendet und danach nicht mehr geändert wurden.</p>` : ''}</div>
    <div class="foot">ServiceDATA Mobil ${VERSION} · Offline-fähig${navigator.serviceWorker?.controller ? ' ✓' : ''}</div>
  </main>`;
  $('#sBack').onclick = () => go('#/');
  $('#sName').onchange = async ev => { const v = ev.target.value.trim(); if (!v) return; S.user = v; await kvSet('user', v); toast('Name gespeichert'); };
  $('#sStamm').onclick = async () => { if (await importStamm()) renderSettings(); };
  $('#sClean') && ($('#sClean').onclick = async () => {
    const del = list.filter(e => erfState(e) === 'gesendet');
    if (!await confirmSheet('Aufräumen?', `${del.length} gesendete Erfassung(en) mit ${del.reduce((s, e) => s + e.fotos.length, 0)} Fotos werden von diesem Gerät gelöscht. In ServiceDATA bleibt alles erhalten.`, 'Aufräumen', true)) return;
    for (const e of del) { for (const f of e.fotos) await blobDel(f.id); await erfDel(e.id); }
    toast('Aufgeräumt'); renderSettings();
  });
}

/* ---------------- Start ---------------- */
(async function init() {
  try { navigator.storage?.persist?.(); } catch { }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
    let reloaded = false; const hadCtl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !hadCtl) return; reloaded = true; if (!S.cur) location.reload(); else toast('Update geladen – wird beim nächsten Start aktiv'); });
  }
  try { S.user = (await kvGet('user')) || ''; S.stamm = (await kvGet('stamm')) || null; }
  catch (e) { $('#app').innerHTML = `<main><div class="warn">Der Gerätespeicher ist nicht verfügbar (${esc(e.message)}). Im privaten Surfmodus funktioniert die App nicht.</div></main>`; return; }
  route();
})();
</script>
